services:
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_USER=application
      - MYSQL_PASSWORD=application
      - MYSQL_DATABASE=loopers
      - MYSQL_CHARACTER_SET=utf8mb4
      - MYSQL_COLLATE=utf8mb4_general_ci
    command: >
      --max-connections=100
      --innodb-buffer-pool-size=2147483648
      --innodb-log-file-size=268435456
      --innodb-flush-log-at-trx-commit=1
      --innodb-lock-wait-timeout=5
      --slow-query-log=ON
      --long-query-time=1
    volumes:
      - mysql-loadtest-data:/var/lib/mysql
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "application", "-papplication"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis-master:
    image: redis:7-alpine
    container_name: lt-redis-master
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis-loadtest-master:/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 2s
      retries: 10

  redis-readonly:
    image: redis:7-alpine
    container_name: lt-redis-readonly
    depends_on:
      redis-master:
        condition: service_healthy
    ports:
      - "6380:6379"
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --replicaof redis-master 6379
      --replica-read-only yes
    volumes:
      - redis-loadtest-readonly:/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 2s
      retries: 10

  kafka:
    image: bitnamilegacy/kafka:3.5.1
    container_name: lt-kafka
    ports:
      - "9092:9092"
      - "19092:19092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,PLAINTEXT_HOST://:19092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:19092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=1
    volumes:
      - kafka-loadtest-data:/bitnami/kafka
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    healthcheck:
      test: ["CMD", "bash", "-c", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  commerce-api:
    build:
      context: .
      dockerfile: apps/commerce-api/Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: local,loadtest
      SPRING_APPLICATION_JSON: '{"queue":{"admission-batch-size":125,"session-validation-enabled":true,"order-limit-per-minute":99999,"ip-rate-limit-per-second":99999}}'
      JAVA_OPTS: -Xmx2g -Xms2g -XX:+UseG1GC -XX:MaxMetaspaceSize=256m
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: application
      MYSQL_PWD: application
      REDIS_MASTER_HOST: redis-master
      REDIS_MASTER_PORT: 6379
      REDIS_REPLICA_1_HOST: redis-readonly
      REDIS_REPLICA_1_PORT: 6379
      BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      mysql:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      redis-readonly:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3g

volumes:
  mysql-loadtest-data:
  redis-loadtest-master:
  redis-loadtest-readonly:
  kafka-loadtest-data:

networks:
  default:
    driver: bridge
