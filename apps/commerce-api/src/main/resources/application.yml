server:
  shutdown: graceful
  tomcat:
    threads:
      max: 40 # Hikari 30 x 1.3 — TX 분리로 커넥션 점유가 짧아 스레드 > 커넥션 OK
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml

auth:
  admin:
    ldap-credential: admin-ldap

payment:
  toss:
    base-url: http://localhost:8090
    secret-key: test_sk_xxxx
    connect-timeout: 3000
    read-timeout: 3000
  nice:
    base-url: http://localhost:8091
    client-key: test_client_xxxx
    secret-key: test_sk_nice_xxxx
    connect-timeout: 3000
    read-timeout: 3000

resilience4j:
  circuitbreaker:
    circuitBreakerAspectOrder: 0
    configs:
      default-request:
        slidingWindowType: TIME_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
        failureRateThreshold: 30
        slowCallDurationThreshold: 2s
        slowCallRateThreshold: 80
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        maxWaitDurationInHalfOpenState: 10s
        ignoreExceptions:
          - com.loopers.support.error.CoreException
          - com.loopers.domain.payment.gateway.PgBusinessException
      default-query:
        slidingWindowType: TIME_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
        failureRateThreshold: 30
        slowCallDurationThreshold: 1500ms
        slowCallRateThreshold: 80
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
        maxWaitDurationInHalfOpenState: 10s
        ignoreExceptions:
          - com.loopers.support.error.CoreException
          - com.loopers.domain.payment.gateway.PgBusinessException
    instances:
      toss-request:
        baseConfig: default-request
      nice-request:
        baseConfig: default-request
      toss-query:
        baseConfig: default-query
      nice-query:
        baseConfig: default-query
  retry:
    retryAspectOrder: 1
    configs:
      default-query-retry:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - com.loopers.domain.payment.gateway.PgTimeoutException
      default-confirm-retry:
        maxAttempts: 2
        waitDuration: 1s
        retryExceptions:
          - com.loopers.domain.payment.gateway.PgCommunicationException
      default-cancel-retry:
        maxAttempts: 3
        waitDuration: 1s
        retryExceptions:
          - com.loopers.domain.payment.gateway.PgTimeoutException
          - com.loopers.domain.payment.gateway.PgCommunicationException
    instances:
      toss-confirm:
        baseConfig: default-confirm-retry
      nice-confirm:
        baseConfig: default-confirm-retry
      toss-query:
        baseConfig: default-query-retry
      nice-query:
        baseConfig: default-query-retry
      toss-cancel:
        baseConfig: default-cancel-retry
      nice-cancel:
        baseConfig: default-cancel-retry
  bulkhead:
    instances:
      pg-payment:
        maxConcurrentCalls: 18
        maxWaitDuration: 0

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local, test

queue:
  session-validation-enabled: false

logging:
  level:
    io.github.resilience4j: DEBUG

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false